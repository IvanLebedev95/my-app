# Перенаправление всего HTTP-трафика на HTTPS + проверка владения доменом для Certbot
server {
    listen 80;
    server_name myapp-ivan.ru;

    # Этот блок нужен, чтобы Let's Encrypt мог проверить владение доменом
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное перенаправляем на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Основной сервер с HTTPS
server {
    listen 443 ssl;
    server_name myapp-ivan.ru;

    # Пути к сертификатам, полученным Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/myapp-ivan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myapp-ivan.ru/privkey.pem;

    # Рекомендуемые настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Корневая папка со статикой React
    root /usr/share/nginx/html;
    index index.html;

    # Проксирование API-запросов на бэкенд-контейнер
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Отдача статики и поддержка SPA-маршрутизации
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}